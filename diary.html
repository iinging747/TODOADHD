<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eadbd2">
<title>TODOADHD Diary</title>
<link rel="manifest" href="./diary.webmanifest">
<style>
@font-face{font-family:LeeSeoyun;src:url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2202-2@1.0/LeeSeoyun.woff") format("woff");font-display:swap}
:root{--bg:#eadbd2;--paper:#fffdf9;--soft:#f0ded6;--line:#dfcec5;--ink:#443d3b;--muted:#8a7c78;--rose:#c49089;--blue:#eef1f6;--shadow:0 24px 60px -30px rgba(92,65,48,.34);--font:LeeSeoyun,Georgia,serif;--body:Pretendard,"Apple SD Gothic Neo",Arial,sans-serif}body.dark{--bg:#181411;--paper:#28231f;--soft:#3a302b;--line:#55463f;--ink:#f7eee8;--muted:#c8bbb4;--rose:#d6a29b;--blue:#303642;--shadow:0 24px 60px -30px rgba(0,0,0,.75)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(90deg,rgba(255,255,255,.2) 1px,transparent 1px) 0 0/38px 38px,linear-gradient(180deg,rgba(255,255,255,.18) 1px,transparent 1px) 0 0/38px 38px,var(--bg);color:var(--ink);font-family:var(--body)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:1280px;margin:0 auto;padding:28px;display:grid;grid-template-columns:230px minmax(0,1fr) 330px;gap:22px}.rail,.paper,.side{background:rgba(255,253,249,.92);border:1px solid var(--line);box-shadow:var(--shadow)}body.dark .rail,body.dark .paper,body.dark .side{background:rgba(40,35,31,.94)}.rail{height:calc(100vh - 56px);position:sticky;top:28px;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}.brand small{font:800 12px var(--body);letter-spacing:.16em;color:var(--muted)}.brand h1{font:400 32px/1 var(--font);margin:8px 0}.brand p{font-size:12px;line-height:1.5;color:var(--muted);margin:0}.auth{border:1px solid var(--line);border-radius:10px;background:rgba(240,222,214,.45);padding:10px;display:grid;gap:8px}.auth b{font-size:13px}.auth input{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn,.ghost{border-radius:6px;padding:9px 10px;font-weight:800;font-size:12px}.btn{background:var(--ink);color:var(--paper)}.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.nav{display:grid;gap:7px}.nav button{text-align:left;border-radius:8px;padding:11px;background:transparent;color:var(--muted);font-weight:800}.nav button.active{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.theme{margin-top:auto}.paper{min-height:calc(100vh - 56px);border-radius:0;padding:34px 38px;position:relative;overflow:hidden}.paper:before{content:"";position:absolute;inset:18px;border:1px solid rgba(223,206,197,.75);pointer-events:none}.page{position:relative;z-index:1}.hero{text-align:center;margin:4px 0 28px}.hero h2{font:400 clamp(48px,8vw,104px)/.9 Georgia,serif;letter-spacing:.08em;margin:0}.hero span{display:block;font:400 42px/1 var(--font);color:var(--muted);margin-top:4px}.datebar{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;max-width:620px;margin:0 auto 24px;padding:10px 16px;background:var(--soft);border:1px solid var(--line);font:400 22px Georgia,serif}.datebar span{font-family:var(--font);font-size:18px;color:var(--muted)}.section-title{font:400 30px Georgia,serif;margin:20px 0 14px}.lines{display:grid;gap:10px}.line{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center}.box{width:23px;height:23px;border:2px solid var(--line);background:var(--paper)}.rule{min-height:31px;border-bottom:2px solid var(--line);display:flex;align-items:flex-end;gap:8px;padding-bottom:5px;font-weight:800;overflow:hidden}.rule small{font-size:11px;color:var(--muted)}.line.done .box{background:var(--ink)}.line.done .rule{text-decoration:line-through;color:var(--muted)}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);background:rgba(255,253,249,.82);border-radius:8px;padding:12px;color:var(--ink);outline:0}.form textarea{min-height:140px;line-height:1.65;resize:vertical;background:repeating-linear-gradient(to bottom,rgba(255,253,249,.75) 0,rgba(255,253,249,.75) 34px,var(--line) 35px)}.notes{margin-top:28px;background:var(--soft);border:1px solid var(--line);padding:18px;min-height:140px}.notes h3{font:400 25px Georgia,serif;margin:0 0 10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{border:1px solid var(--line);border-radius:10px;background:rgba(255,253,249,.76);padding:15px}.card h3{margin:0 0 8px;font:400 24px var(--font)}.muted{color:var(--muted);font-size:13px;line-height:1.55}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{aspect-ratio:1;border:1px solid var(--line);background:rgba(255,253,249,.72);border-radius:6px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:5px}.day.sel{outline:2px solid var(--ink)}.day em{font-style:normal;font-weight:900;font-size:12px}.dot{width:6px;height:6px;border-radius:50%;background:var(--rose)}.side{height:calc(100vh - 56px);position:sticky;top:28px;border-radius:12px;padding:18px;overflow:auto}.side h3{font:400 25px var(--font);margin:0 0 10px}.task{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}.task input{margin-top:3px}.mobilebar{display:none}.empty{color:var(--muted);font-size:13px}.toast{position:fixed;right:24px;bottom:24px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);padding:12px 14px;border-radius:10px;font-weight:800;z-index:30}@media(max-width:980px){.app{display:block;padding:12px 12px 92px}.rail{display:none}.paper,.side{min-height:auto;height:auto;position:static;border-radius:0;padding:22px 18px;margin-bottom:14px}.paper:before{inset:10px}.hero h2{font-size:54px}.grid2{grid-template-columns:1fr}.mobilebar{display:grid;position:fixed;left:10px;right:10px;bottom:10px;z-index:20;grid-template-columns:repeat(5,1fr);gap:5px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:7px}.mobilebar button{background:transparent;color:var(--muted);font-size:11px;font-weight:900;padding:8px 3px;border-radius:10px}.mobilebar button.active{background:var(--soft);color:var(--ink)}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail"><div class="brand"><small>TODOADHD</small><h1>정신차려</h1><p>까먹지 않게, 너무 몰아붙이지 않게. 나만 보는 다이어리 웹앱.</p></div><div class="auth" id="auth"></div><nav class="nav" id="nav"></nav><button class="ghost theme" id="theme">라이트 / 다크</button></aside>
  <main class="paper"><div class="page" id="main"></div></main>
  <aside class="side" id="side"></aside>
</div>
<nav class="mobilebar" id="mobile"></nav>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], pad=n=>String(n).padStart(2,'0'), today=()=>new Date(), dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const menus=[['calendar','달력'],['todo','추가'],['diary','일기'],['focus','집중'],['budget','가계부'],['invest','투자'],['clients','클라'],['wish','위시']];
let view='calendar', selected=new Date(), cursor=new Date(selected.getFullYear(),selected.getMonth(),1), timer=null,left=25*60;
const userKey='diaryapp_user', usersKey='diaryapp_users';
function user(){return localStorage.getItem(userKey)||'guest'}function key(k){return `diaryapp_${user()}_${k}`}function load(k,f){try{return JSON.parse(localStorage.getItem(key(k)))??f}catch{return f}}function save(k,v){localStorage.setItem(key(k),JSON.stringify(v))}function users(){try{return JSON.parse(localStorage.getItem(usersKey))||{}}catch{return {}}}function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
let tasks=load('tasks',[]), diaries=load('diaries',{}), money=load('money',[]), invest=load('invest',[]), clients=load('clients',[]), wishes=load('wishes',[]);
function persist(){save('tasks',tasks);save('diaries',diaries);save('money',money);save('invest',invest);save('clients',clients);save('wishes',wishes)}
async function hash(p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+'todo-salt'));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function signup(){const id=$('#uid').value.trim().toLowerCase(), pw=$('#upw').value;if(id.length<3||pw.length<4)return toast('아이디 3글자, 비번 4글자 이상');const u=users();if(u[id])return toast('이미 있는 아이디야');u[id]=await hash(pw);localStorage.setItem(usersKey,JSON.stringify(u));login(id,pw)}
async function login(id=$('#uid').value.trim().toLowerCase(),pw=$('#upw').value){const u=users();if(!u[id])return toast('없는 아이디야');if(u[id]!==await hash(pw))return toast('비밀번호가 달라');localStorage.setItem(userKey,id);tasks=load('tasks',[]);diaries=load('diaries',{});money=load('money',[]);invest=load('invest',[]);clients=load('clients',[]);wishes=load('wishes',[]);toast(`${id} 로그인`);renderAll()}
function logout(){localStorage.setItem(userKey,'guest');tasks=load('tasks',[]);diaries=load('diaries',{});money=load('money',[]);invest=load('invest',[]);clients=load('clients',[]);wishes=load('wishes',[]);renderAll()}
function renderAuth(){const u=user();$('#auth').innerHTML=`<b>${u==='guest'?'게스트':'@'+safe(u)}</b><input id="uid" placeholder="아이디"><input id="upw" type="password" placeholder="비밀번호"><div class="row"><button class="btn" id="login">로그인</button><button class="ghost" id="signup">회원가입</button></div><button class="ghost" id="logout">게스트 전환</button><p class="muted">아이디별로 이 기기 안의 기록이 분리돼.</p>`;$('#login').onclick=()=>login();$('#signup').onclick=signup;$('#logout').onclick=logout}
function renderNav(){const html=menus.map(([id,l])=>`<button class="${view===id?'active':''}" data-v="${id}">${l}</button>`).join('');$('#nav').innerHTML=html;$('#mobile').innerHTML=menus.slice(0,5).map(([id,l])=>`<button class="${view===id?'active':''}" data-v="${id}">${l}</button>`).join('');$$('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;renderAll()})}
function tasksOn(k){return tasks.filter(t=>t.date===k).sort((a,b)=>a.done-b.done||a.time.localeCompare(b.time))}function dateLabel(d){return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells='';for(let i=0;i<42;i++){const n=i-first+1,d=n<1?new Date(y,m-1,prev+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n),k=dkey(d),list=tasksOn(k);cells+=`<button class="day ${k===dkey(selected)?'sel':''}" data-date="${k}"><em>${d.getDate()}</em>${list.length?'<span class="dot"></span>':''}<small>${list.length||''}</small></button>`}$('#main').innerHTML=`<div class="hero"><h2>MONTHLY</h2><span>planner</span></div><div class="datebar"><b>Date:</b><span>${dateLabel(selected)}</span></div><div class="row"><button class="ghost" id="prev">이전</button><button class="ghost" id="next">다음</button></div><div class="calendar" style="margin-top:14px">${cells}</div>`;$('#prev').onclick=()=>{cursor=new Date(y,m-1,1);renderAll()};$('#next').onclick=()=>{cursor=new Date(y,m+1,1);renderAll()};$$('.day').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date);renderAll()})}
function renderTodo(){const list=tasksOn(dkey(selected));const rows=Array.from({length:Math.max(9,list.length+3)},(_,i)=>{const t=list[i];return t?`<div class="line ${t.done?'done':''}"><span class="box"></span><span class="rule">${safe(t.text)} <small>${safe(t.time)}</small></span><button class="ghost" data-done="${t.id}">${t.done?'완료':'체크'}</button></div>`:`<div class="line"><span class="box"></span><span class="rule"></span><span></span></div>`}).join('');$('#main').innerHTML=`<div class="hero"><h2>To Do List</h2><span>entry</span></div><div class="datebar"><b>Date:</b><span>${dateLabel(selected)}</span></div><div class="section-title">To Do</div><div class="lines">${rows}</div><div class="notes"><h3>Notes</h3><div class="form"><input id="taskText" placeholder="할 일"><input id="taskTime" placeholder="시간 예: 09:30"><button class="btn" id="addTask">추가</button></div></div>`;$('#addTask').onclick=()=>{const text=$('#taskText').value.trim();if(!text)return;tasks.push({id:Date.now()+Math.random(),date:dkey(selected),text,time:$('#taskTime').value||'오늘',done:false});persist();renderAll()};$$('[data-done]').forEach(b=>b.onclick=()=>{const t=tasks.find(x=>String(x.id)===b.dataset.done);t.done=!t.done;persist();renderAll()})}
function renderDiary(){const k=dkey(selected),d=diaries[k]||{};$('#main').innerHTML=`<div class="hero"><h2>DIARY</h2><span>today</span></div><div class="datebar"><b>Date:</b><span>${dateLabel(selected)}</span></div><div class="form"><select id="mood"><option>${d.mood||'멍함'}</option><option>차분함</option><option>불안</option><option>뿌듯함</option><option>과부하</option></select><textarea id="diaryText" placeholder="나만 보는 일기">${safe(d.text||'')}</textarea><button class="btn" id="saveDiary">일기 저장</button></div><div class="notes"><h3>AI-ish comment</h3><p class="muted">${comment(d.text)}</p></div>`;$('#saveDiary').onclick=()=>{diaries[k]={mood:$('#mood').value,text:$('#diaryText').value,at:Date.now()};persist();toast('일기 저장 완료');renderAll()}}
function comment(t=''){if(!t)return '한 줄만 써도 기록이야. 오늘의 너를 증거로 남겨두자.';if(/불안|힘들|우울|망/.test(t))return '오늘은 의지 문제가 아니라 과부하 쪽이 커 보여. 계획을 줄이고 실제 피해가 큰 것 하나만 먼저 보자.';if(/좋|완료|해냈|뿌듯/.test(t))return '이 패턴은 저장할 만해. 같은 시간대와 장소 조건을 다음에도 재사용하자.';return '결론을 너무 빨리 내리지 말고, 15분짜리 행동 하나로 현실감을 회복하자.'}
function renderFocus(){const mm=Math.floor(left/60),ss=left%60;$('#main').innerHTML=`<div class="hero"><h2>FOCUS</h2><span>five minutes</span></div><div class="card" style="text-align:center"><h3 style="font-size:64px">${pad(mm)}:${pad(ss)}</h3><div class="row"><button class="btn" id="start">시작</button><button class="ghost" id="pause">멈춤</button></div><div class="row" style="margin-top:8px"><button class="ghost" data-min="5">5분</button><button class="ghost" data-min="25">25분</button></div></div>`;$('#start').onclick=()=>{if(timer)return;timer=setInterval(()=>{left--;if(left<=0){clearInterval(timer);timer=null;left=25*60;toast('집중 완료');}renderFocus()},1000)};$('#pause').onclick=()=>{clearInterval(timer);timer=null};$$('[data-min]').forEach(b=>b.onclick=()=>{left=Number(b.dataset.min)*60;renderFocus()})}
function renderBudget(){pageList('BUDGET','ledger',money,'money',['name','amount'])}function renderInvest(){pageList('INVEST','retrospect',invest,'invest',['asset','rate'])}function renderClients(){pageList('CLIENTS','contacts',clients,'clients',['name','memo'])}function renderWish(){pageList('WISHES','kept',wishes,'wishes',['text','reason'])}
function pageList(title,script,arr,keyName,fields){$('#main').innerHTML=`<div class="hero"><h2>${title}</h2><span>${script}</span></div><div class="form">${fields.map(f=>`<input id="${f}" placeholder="${f}">`).join('')}<button class="btn" id="addItem">저장</button></div><div class="grid2" style="margin-top:14px">${arr.map((x,i)=>`<div class="card"><h3>${safe(x[fields[0]])}</h3><p class="muted">${safe(x[fields[1]]||'')}</p></div>`).join('')}</div>`;$('#addItem').onclick=()=>{const o={date:dkey(selected),at:Date.now()};fields.forEach(f=>o[f]=$('#'+f).value);arr.unshift(o);persist();renderAll()}}
function renderSide(){const list=tasksOn(dkey(selected));const diary=diaries[dkey(selected)]||{};$('#side').innerHTML=`<h3>${dateLabel(selected)}</h3><p class="muted">오늘 할 일 ${list.length}개</p>${list.length?list.map(t=>`<label class="task"><input type="checkbox" ${t.done?'checked':''} data-side="${t.id}"><span><b>${safe(t.text)}</b><br><small class="muted">${safe(t.time)}</small></span></label>`).join(''):'<p class="empty">비어 있어도 괜찮아.</p>'}<div class="notes"><h3>Diary</h3><p class="muted">${safe(diary.text||'아직 기록 없음')}</p></div>`;$$('[data-side]').forEach(b=>b.onchange=()=>{const t=tasks.find(x=>String(x.id)===b.dataset.side);t.done=!t.done;persist();renderAll()})}
function renderAll(){renderAuth();renderNav();if(view==='calendar')renderCalendar();if(view==='todo')renderTodo();if(view==='diary')renderDiary();if(view==='focus')renderFocus();if(view==='budget')renderBudget();if(view==='invest')renderInvest();if(view==='clients')renderClients();if(view==='wish')renderWish();renderSide()}$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('diary_theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('diary_theme')==='dark')document.body.classList.add('dark');if('serviceWorker'in navigator)navigator.serviceWorker.register('./diary-sw.js').catch(()=>{});renderAll();
</script>
</body>
</html>
