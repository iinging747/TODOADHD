<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f7f8fc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="./manifest.webmanifest" />
<title>정신차려 이 각박한 세상에서, 그렇게 안 살기 프로젝트</title>
<style>
:root{--ink:#293044;--sub:#697187;--line:#e8ebf3;--mist:#f7f8fc;--cloud:#eef4ff;--peach:#ffe6dc;--butter:#fff3c9;--lilac:#eee6ff;--leaf:#e2f6e6;--rose:#ffe8ef;--denim:#5b7bd5;--white:rgba(255,255,255,.92)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0,rgba(255,230,220,.8),transparent 34rem),linear-gradient(180deg,#fff,var(--mist));color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{width:min(100%,980px);min-height:100vh;margin:0 auto;padding:18px 16px 104px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;max-width:430px;margin:0 auto}h1{font-size:20px;line-height:1.25;margin:2px 0 0;font-weight:1000}h2{font-size:17px;margin:0;font-weight:1000}h3{font-size:14px;margin:0;font-weight:1000}p{margin:0}.eyebrow{font-size:12px;font-weight:1000;color:var(--denim);margin-bottom:5px}.muted{font-size:13px;line-height:1.65;color:var(--sub)}.pill{border:1px solid var(--line);border-radius:999px;background:#fff;padding:8px 10px;font-size:12px;font-weight:1000}.grid{display:grid;gap:14px;margin:18px auto 0;max-width:430px}.card{border:1px solid rgba(88,94,125,.13);border-radius:8px;background:var(--white);box-shadow:0 12px 26px rgba(54,60,88,.08);padding:15px}.hero{display:flex;justify-content:space-between;gap:12px;align-items:center}.avatar{width:118px;height:118px;min-width:118px;position:relative;filter:drop-shadow(0 8px 0 #fff) drop-shadow(0 12px 18px rgba(50,54,75,.13))}.hair{position:absolute;inset:0 8px 12px;border-radius:48% 48% 42% 42%;background:#202435}.face{position:absolute;inset:10px 22px 16px;border-radius:45%;background:#fff1e8;border:3px solid #202435}.bang{position:absolute;left:19px;right:23px;top:19px;height:42px;border-radius:50% 50% 30% 30%;background:#202435}.eye{position:absolute;top:55px;width:9px;height:12px;border-radius:50%;background:#26324c}.eye.l{left:43px}.eye.r{right:43px}.mouth{position:absolute;left:53px;top:78px;width:18px;height:8px;border-bottom:3px solid #6a4d50;border-radius:0 0 20px 20px}.hood{position:absolute;left:25px;right:25px;bottom:4px;height:34px;border-radius:30px 30px 6px 6px;background:#293044}.prop{position:absolute;right:3px;bottom:3px;width:37px;height:37px;display:grid;place-items:center;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:20px}.bubble{display:inline-block;border:1px solid #d9deeb;border-radius:999px;background:#fff;padding:6px 10px;font-size:11px;font-weight:1000}.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.calendar-head button,.ghost,.primary{border-radius:8px;padding:11px 12px;font-size:13px;font-weight:1000}.ghost{background:var(--mist);color:var(--ink)}.primary{background:var(--ink);color:#fff;width:100%}.blue{background:var(--denim)}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week{margin-top:14px}.week span{text-align:center;font-size:11px;font-weight:1000;color:var(--sub)}.day{min-height:72px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px;text-align:left;position:relative}.day.muted-day{opacity:.35}.day.selected{outline:2px solid var(--denim);background:var(--cloud)}.day.today .num{background:var(--ink);color:#fff}.num{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;font-size:12px;font-weight:1000}.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--denim)}.count{font-size:10px;color:var(--sub);margin-top:4px}.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.check{width:26px;height:26px;border-radius:8px;border:2px solid #cfd5e4;display:grid;place-items:center;color:transparent;font-weight:1000}.task.done{opacity:.66}.task.done .check{background:var(--leaf);border-color:var(--leaf);color:var(--ink)}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--mist);outline:0;padding:13px;color:var(--ink)}textarea{min-height:128px;resize:none;line-height:1.6}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:10px;overflow:auto;padding-bottom:8px}.sticker{width:150px;flex:0 0 auto;text-align:center}.mini{transform:scale(.68);transform-origin:center top;margin:2px auto -18px;height:112px}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 10px 14px;background:rgba(255,255,255,.94);border-top:1px solid var(--line);box-shadow:0 -10px 28px rgba(40,45,70,.08)}.tabs button{height:56px;border-radius:8px;background:transparent;color:#737b90;font-size:11px;font-weight:1000}.tabs button.active{background:var(--ink);color:#fff}.screen{display:none}.screen.active{display:block;animation:show .22s ease-out}@keyframes show{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.toast{position:fixed;left:16px;right:16px;bottom:92px;max-width:398px;margin:auto;border-radius:8px;background:var(--ink);color:#fff;padding:14px;font-size:13px;display:none}.toast.show{display:block}@media(min-width:860px){.top{max-width:100%}.grid{max-width:none;grid-template-columns:1.1fr .9fr}.tabs{left:auto;right:24px;bottom:24px;transform:none;border:1px solid var(--line);border-radius:14px;max-width:430px}.day{min-height:96px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div><p class="eyebrow">ADHD 체크메이트 달력</p><h1>정신차려 이 각박한 세상에서,<br>그렇게 안 살기 프로젝트</h1></div><button class="pill" id="installBtn" hidden>앱 설치</button></header>
<section id="calendarScreen" class="screen active"><div class="grid"><article class="card"><div class="calendar-head"><button class="ghost" onclick="moveMonth(-1)">이전</button><div style="text-align:center"><p class="eyebrow">첫 화면</p><h2 id="monthTitle">2026년 5월</h2></div><button class="ghost" onclick="moveMonth(1)">다음</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar" id="calendarGrid" style="margin-top:8px"></div></article><aside class="card"><div class="hero"><div><span class="bubble">오늘도 화이팅!</span><h2 id="selectedTitle" style="margin-top:10px">선택한 날짜</h2><p class="muted">날짜를 누르면 그날 해야 할 일을 기록하고 확인할 수 있어요.</p></div><div class="avatar"><div class="hair"></div><div class="face"></div><div class="bang"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="hood"></div><div class="prop">🗓</div></div></div><div id="selectedTasks" style="display:grid;gap:9px;margin-top:14px"></div><button class="primary blue" style="margin-top:12px" onclick="go('addScreen')">이 날짜에 할 일 추가</button></aside></div></section>
<section id="addScreen" class="screen"><div class="grid"><article class="card"><p class="eyebrow">두 번째 화면</p><h2>해야 하는 일 추가하기</h2><p class="muted" id="addDateLabel" style="margin:8px 0 12px">선택한 날짜에 추가됩니다.</p><textarea id="roughInput" placeholder="대충 말해도 돼요. 예: 병원 예약 확인하고 영상 편집 조금, 카드값도 봐야 함. 너무 귀찮음."></textarea><div class="split" style="margin-top:10px"><input id="taskTime" type="time" value="09:30"><select id="taskType"><option value="plan">계획</option><option value="edit">영상</option><option value="ai">AI 공부</option><option value="money">가계부/빚</option><option value="mind">감정</option></select></div><div class="split" style="margin-top:10px"><button class="primary blue" onclick="addTaskFromRough()">찰떡같이 추가</button><button class="ghost" onclick="startVoice()">음성으로 추가</button></div></article><article class="card"><p class="eyebrow">AI가 알아서 쪼갠 결과</p><div id="aiPlan" style="display:grid;gap:9px"></div></article></div></section>
<section id="stickersScreen" class="screen"><div class="grid"><article class="card"><p class="eyebrow">첨부 사진 스타일</p><h2>상황별 캐릭터 스티커</h2><div class="row" id="stickerRow" style="margin-top:12px"></div></article><article class="card"><p class="eyebrow">쿼카 도장</p><h2>완료하면 귀엽게 도장</h2><div class="row" id="stampRow" style="margin-top:12px"></div></article></div></section>
<section id="mindScreen" class="screen"><div class="grid"><article class="card"><p class="eyebrow">하소연해도 알아듣기</p><textarea id="ventInput" placeholder="오늘 아무것도 하기 싫다. 불안해서 쇼츠만 봄. 돈도 걱정됨."></textarea><button class="primary blue" style="margin-top:10px" onclick="analyzeMind()">심리상태 분석</button></article><article class="card"><p class="eyebrow">조언</p><div id="mindResult" style="display:grid;gap:9px"></div></article></div></section>
<section id="moneyScreen" class="screen"><div class="grid"><article class="card"><p class="eyebrow">가계부 / 빚 청산</p><div class="split"><input id="spendText" placeholder="지출 내용"><input id="spendAmount" type="number" placeholder="금액"></div><button class="primary blue" style="margin-top:10px" onclick="addSpend()">지출 기록</button></article><article class="card"><p class="eyebrow">소비 기록</p><h2 id="moneyTotal">0원</h2><div id="spendList" style="display:grid;gap:9px;margin-top:12px"></div></article></div></section>
</main>
<nav class="tabs"><button class="active" onclick="go('calendarScreen',this)">달력</button><button onclick="go('addScreen',this)">추가</button><button onclick="go('stickersScreen',this)">스티커</button><button onclick="go('mindScreen',this)">감정</button><button onclick="go('moneyScreen',this)">가계부</button></nav><div class="toast" id="toast"></div>
<script>
const today=new Date();let viewYear=today.getFullYear(),viewMonth=today.getMonth(),selected=toKey(today);const tasksByDate={[selected]:[{time:'09:30',text:'병원 시간 확인',type:'plan',done:false},{time:'13:00',text:'영상 파일 열기',type:'edit',done:false},{time:'21:30',text:'상환 날짜 체크',type:'money',done:false}]},spends=[];const typeMeta={plan:['오늘 계획 세우기','오늘도 화이팅!','🗓','var(--cloud)'],edit:['영상 편집하기','영상 편집중!','🖥','var(--peach)'],ai:['AI 공부','AI 공부 진입!','📚','var(--lilac)'],money:['빚 현황 정리','빚, 꼭 갚는다!','₩','var(--leaf)'],mind:['일기 / 감정 정리','솔직하게!','✎','var(--rose)']};
function toKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dateLabel(k){const [y,m,d]=k.split('-');return `${y}년 ${Number(m)}월 ${Number(d)}일`}function renderCalendar(){monthTitle.textContent=`${viewYear}년 ${viewMonth+1}월`;const first=new Date(viewYear,viewMonth,1),start=new Date(viewYear,viewMonth,1-first.getDay());calendarGrid.innerHTML='';for(let i=0;i<42;i++){const date=new Date(start);date.setDate(start.getDate()+i);const key=toKey(date),list=tasksByDate[key]||[];const el=document.createElement('button');el.className=`day ${date.getMonth()!==viewMonth?'muted-day':''} ${key===selected?'selected':''} ${key===toKey(today)?'today':''}`;el.innerHTML=`<span class="num">${date.getDate()}</span><div class="dots">${list.slice(0,4).map(t=>`<i class="dot" style="background:${typeMeta[t.type]?.[3]||'var(--denim)'}"></i>`).join('')}</div>${list.length?`<div class="count">${list.length}개</div>`:''}`;el.onclick=()=>{selected=key;renderAll()};calendarGrid.appendChild(el)}}
function renderSelected(){selectedTitle.textContent=dateLabel(selected);addDateLabel.textContent=`${dateLabel(selected)}에 추가됩니다.`;const list=tasksByDate[selected]||[];selectedTasks.innerHTML=list.length?list.map((t,i)=>taskHtml(t,i)).join(''):'<p class="muted">아직 기록된 할 일이 없어요. 두 번째 탭에서 추가해요.</p>'}function taskHtml(t,i){const meta=typeMeta[t.type]||typeMeta.plan;return `<div class="task ${t.done?'done':''}" onclick="toggleTask(${i})"><div class="check">✓</div><div style="flex:1"><p class="eyebrow">${t.time} · ${meta[0]}</p><h3>${t.text}</h3></div><div class="icon" style="background:${meta[3]}">${meta[2]}</div></div>`}function toggleTask(i){const list=tasksByDate[selected]||[];list[i].done=!list[i].done;if(list[i].done)toast('완료! 쿼카 도장 찍었어요.');renderAll()}function moveMonth(d){viewMonth+=d;if(viewMonth<0){viewMonth=11;viewYear--}if(viewMonth>11){viewMonth=0;viewYear++}renderCalendar()}
function addTaskFromRough(){const raw=roughInput.value.trim();if(!raw)return toast('할 일을 대충이라도 적어줘요.');const type=/돈|빚|카드|상환|지출/.test(raw)?'money':/영상|편집|촬영/.test(raw)?'edit':/AI|공부|프롬프트/.test(raw)?'ai':/불안|감정|힘들|싫/.test(raw)?'mind':taskType.value;const pieces=raw.split(/그리고|,|\.|\/|랑|하고/).map(x=>x.trim()).filter(Boolean).slice(0,4);const list=tasksByDate[selected] ||= [];pieces.forEach((p,idx)=>list.push({time:shiftTime(taskTime.value,idx),text:p.length>28?p.slice(0,28)+'...':p,type,done:false}));aiPlan.innerHTML=[['강점 활용','여러 흐름을 동시에 굴리는 장점을 살려 날짜 안에 작은 행동으로 나눴어요.'],['실행 방식','끝내기가 아니라 시작하기 쉬운 형태로 저장했어요.'],['선택 날짜',dateLabel(selected)]].map(x=>`<div class="card"><p class="eyebrow">${x[0]}</p><p class="muted">${x[1]}</p></div>`).join('');roughInput.value='';renderAll();go('calendarScreen');toast('선택한 날짜 달력에 할 일을 추가했어요.')}function shiftTime(t,i){const [h,m]=t.split(':').map(Number);return `${String(Math.min(23,h+i*2)).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function renderStickers(){stickerRow.innerHTML=Object.entries(typeMeta).map(([k,m])=>`<article class="card sticker"><span class="bubble">${m[1]}</span><div class="avatar mini"><div class="hair"></div><div class="face"></div><div class="bang"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="hood"></div><div class="prop">${m[2]}</div></div><h3>${m[0]}</h3></article>`).join('');stampRow.innerHTML=['오늘도 살아남음','할 일 체크','빚 상환 완료','하루 마무리'].map(x=>`<article class="card sticker"><span class="bubble">완료!</span><div style="font-size:42px">쿼카</div><h3>${x}</h3></article>`).join('')}
function analyzeMind(){const t=ventInput.value,b=/힘들|피곤|무기력|불안|스트레스/.test(t),a=/쇼츠|트위터|누워|회피|도망|미룸/.test(t);mindResult.innerHTML=[['심리상태',b?'에너지 저하와 과부하 신호가 있어요.':'정리 가능한 상태예요.'],['패턴',a?'불안할 때 정보탐색/회피로 빠지는 경향이 보여요.':'흐름 유지가 가능한 상태예요.'],['조언','오늘은 생존 모드. 달력에서 가장 쉬운 할 일 하나만 체크하자.']].map(x=>`<div class="card"><p class="eyebrow">${x[0]}</p><p class="muted">${x[1]}</p></div>`).join('')}function addSpend(){const a=Number(spendAmount.value||0);if(!a)return toast('금액을 입력해줘요.');spends.push({text:spendText.value||'무제 지출',amount:a});moneyTotal.textContent=`${spends.reduce((s,x)=>s+x.amount,0).toLocaleString()}원`;spendList.innerHTML=spends.map(s=>`<div class="task"><div class="icon" style="background:var(--cloud)">₩</div><div><h3>${s.text}</h3><p class="muted">${s.amount.toLocaleString()}원 · 압박 없이 기록</p></div></div>`).join('')}function startVoice(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return toast('이 브라우저에서는 음성 입력이 잠깐 쉬고 있어요.');const r=new S();r.lang='ko-KR';r.onresult=e=>{roughInput.value=e.results[0][0].transcript;addTaskFromRough()};r.start()}function go(id,btn){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));(btn||document.querySelector(`.tabs button[onclick*="${id}"]`))?.classList.add('active')}function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}let deferredInstall;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;installBtn.hidden=false});installBtn.onclick=()=>{deferredInstall?.prompt();installBtn.hidden=true};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});function renderAll(){renderCalendar();renderSelected();renderStickers()}renderAll();
</script>
</body>
</html>
