name: Add cumulative private diary photos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-diary:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch diary UI and storage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          cal = Path('calendar.html')
          text = cal.read_text(encoding='utf-8')

          css = r'''
/* diary-photos-v19 */
.diary-private-note{background:linear-gradient(135deg,var(--pink),var(--blue));border:1px solid rgba(255,255,255,.82);border-radius:24px;padding:14px 16px;margin-bottom:14px}
.diary-private-note h3{margin:0 0 6px;font-size:22px}.diary-private-note p{margin:0;font-family:var(--body);font-size:13px;line-height:1.55;color:var(--muted)}
.diary-file{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:1px dashed #d8cfca;border-radius:18px;background:rgba(255,255,255,.72);color:var(--muted);font-family:var(--body);font-size:14px;font-weight:900;padding:12px;text-align:center}
.diary-file input{display:none}.diary-preview{display:none;align-items:center;gap:10px;background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:18px;padding:10px}.diary-preview img{width:72px;height:72px;border-radius:16px;object-fit:cover}.diary-preview span{font-family:var(--body);font-size:13px;color:var(--muted)}
.diary-list{display:grid;gap:12px;margin-top:14px;max-height:520px;overflow:auto;padding-right:4px}.diary-entry{background:rgba(255,255,255,.82);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:0 8px 22px rgba(38,43,66,.06)}.diary-entry-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.diary-entry-date{font-family:var(--body);font-size:12px;font-weight:900;color:var(--muted)}.diary-entry-mood{background:var(--soft);border-radius:999px;padding:6px 9px;font-family:var(--body);font-size:12px;font-weight:900}.diary-entry p{margin:0;font-family:var(--body);font-size:14px;line-height:1.65;white-space:pre-wrap;color:var(--ink)}.diary-entry img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-top:10px;border:1px solid var(--line)}
.diary-empty{padding:22px;border-radius:22px;background:rgba(255,255,255,.72);border:1px solid var(--line);font-family:var(--body);color:var(--muted);line-height:1.6}
@media(max-width:768px){.diary-list{max-height:none}.diary-entry img{max-height:220px}.diary-private-note h3{font-size:19px}}
'''

          js = r'''
/* diary-photos-v19 */
function diaryList(){return diaries.filter(d=>d&&(d.kind==='diary'||d.text||d.photo)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));}
function diaryPersonalComment(entry){
  const t=(entry?.text||'').trim();
  const mood=entry?.mood||'';
  if(!t)return '오늘 마음을 길게 설명하지 않아도 돼. 한 문장만 남겨도 내일의 너한테는 꽤 좋은 단서가 돼.';
  const lower=t.toLowerCase();
  if(/불안|무섭|망했|힘들|우울|멘붕|과부하|짜증|화남|빡|눈물/.test(t))return '지금 기록은 의지가 약하다는 증거가 아니라, 부하가 어디서 걸렸는지 알려주는 지도에 가까워. 오늘은 계획을 줄이고 실제 피해가 큰 것 하나만 먼저 잡자.';
  if(/미룸|못함|안 함|하기 싫|귀찮|도피|트위터|쇼츠/.test(t))return '회피가 있었다면 이유가 있었을 가능성이 커. 자책보다 조건을 바꾸자. 내일은 시작 버튼을 아주 작게 만들고, 5분짜리 행동 하나만 달력에 올려둘게.';
  if(/해냈|완료|뿌듯|좋았|성공|집중|잘했/.test(t)||mood==='뿌듯함')return '오늘 잘 된 건 운이 아니라 패턴이야. 시간대, 장소, 시작 방식 중 하나를 저장해두면 다음번 성공 확률이 올라가. 이건 꽤 중요한 데이터다.';
  if(/돈|빚|상환|소비|카드|투자|수익|손실|매매/.test(t))return '돈 이야기는 감정이 같이 붙어서 더 크게 느껴져. 숫자와 감정을 분리해서 기록한 건 잘했어. 판단은 차갑게, 사람한테는 부드럽게 가자.';
  if(lower.includes('ai')||/공부|강의|자료|정리|기획|글쓰기/.test(t))return '머릿속에 재료가 많은 날이네. 전부 완성하려고 하면 멈추니까, 내일은 “자료 모으기”와 “제출물 만들기”를 분리해서 잡는 게 좋아.';
  return '오늘 기록은 충분히 현실적이야. 감정은 감정대로 두고, 내일은 제일 작은 행동 하나만 먼저 꺼내자. 계속 이어지는 게 핵심이니까.';
}
function renderMood(){
  const list=diaryList();
  const last=list[0]||{};
  $('#main').innerHTML=`<section class="section-title"><div><h2>비공개 감정 일기</h2><p>일정이 아니라 너만 보는 공간. 매일 누적으로 저장되고, 사진도 일기 안에만 붙어.</p></div></section><div class="diary-private-note"><h3>나만 보는 기록</h3><p>오늘이 엉망이어도 기록은 덮어쓰지 않아. 새 일기로 계속 쌓아두고, 다음날 판단 재료로만 조용히 써.</p></div><div class="quick-form"><select id="mood"><option>멍함</option><option>불안</option><option>뿌듯함</option><option>과부하</option><option>차분함</option><option>지침</option><option>분노</option></select><textarea id="diary" placeholder="오늘 마음 상태를 대충 적어도 돼. 일정이 아니라 진짜 일기장처럼 저장할게."></textarea><label class="diary-file">사진 첨부하기<input id="diaryPhoto" type="file" accept="image/*"></label><div class="diary-preview" id="diaryPreview"><img alt="일기 사진 미리보기"><span>이 사진은 이번 일기 안에만 저장돼.</span></div><button class="primary" id="saveDiary">일기 저장</button></div><div class="divider"></div><div class="soft-card"><h3>개인비서 코멘트</h3><p class="muted" id="diaryComment">${diaryPersonalComment(last)}</p></div><div class="diary-list">${list.length?list.map(d=>`<article class="diary-entry"><div class="diary-entry-head"><span class="diary-entry-date">${safe(d.date||'')} ${safe(d.time||'')}</span><span class="diary-entry-mood">${safe(d.mood||'기록')}</span></div><p>${safe(d.text||'')}</p>${d.photo?`<img src="${d.photo}" alt="일기 첨부 사진">`:''}</article>`).join(''):'<div class="diary-empty">아직 저장된 일기가 없어. 오늘 한 줄만 남겨도 첫 기록이 돼.</div>'}</div>`;
  let photoData='';
  const file=$('#diaryPhoto'), preview=$('#diaryPreview'), previewImg=preview?.querySelector('img');
  $('#diary').oninput=()=>{$('#diaryComment').textContent=diaryPersonalComment({text:$('#diary').value,mood:$('#mood').value});};
  $('#mood').onchange=()=>{$('#diaryComment').textContent=diaryPersonalComment({text:$('#diary').value,mood:$('#mood').value});};
  file.onchange=()=>{const f=file.files?.[0]; if(!f)return; if(f.size>1800000){toast('사진이 조금 커. 1.8MB 이하 사진으로 넣어줘.'); file.value=''; return;} const reader=new FileReader(); reader.onload=()=>{photoData=reader.result; preview.style.display='flex'; previewImg.src=photoData;}; reader.readAsDataURL(f);};
  $('#saveDiary').onclick=()=>{const text=$('#diary').value.trim(), mood=$('#mood').value; if(!text&&!photoData){toast('한 줄이나 사진 하나는 남겨줘.');return;} const now=new Date(); diaries.unshift({id:Date.now(),kind:'diary',date:todayKey(),time:`${pad(now.getHours())}:${pad(now.getMinutes())}`,mood,text,photo:photoData,createdAt:Date.now()}); saveAll(); toast('일기 저장했어. 덮어쓰지 않고 누적으로 쌓아둘게.'); render();};
}
'''

          text = re.sub(r'\n\s*/\* diary-photos-v19 \*/.*?(?=\n\s*</style>)', '', text, flags=re.S)
          text = text.replace('</style>', css + '\n  </style>')
          text = re.sub(r'\n/\* diary-photos-v19 \*/.*?(?=\nif\(localStorage\.getItem)', '', text, flags=re.S)
          text = text.replace("if(localStorage.getItem('todoAdhdTheme')", js + "\nif(localStorage.getItem('todoAdhdTheme')")
          cal.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "todoadhd-diary-photos-v19";', s)
              sw.write_text(s, encoding='utf-8')
          PY
      - name: Commit and deploy
        shell: bash
        run: |
          set -euo pipefail
          git add calendar.html sw.js
          if git diff --cached --quiet; then
            echo "No diary changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "add cumulative private diary photo attachments"
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
