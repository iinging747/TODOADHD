name: Enable automatic GPS weather

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-weather:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch automatic GPS weather
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import re
          cal = Path('calendar.html')
          text = cal.read_text(encoding='utf-8')
          encoded = ''
          auto_js = base64.b64decode(encoded).decode('utf-8')
          text = re.sub(r'\n/\* weather-autogps-v18 \*/.*?(?=\nif\(localStorage\.getItem\(\'todoAdhdTheme\'\))', '', text, flags=re.S)
          marker = "if(localStorage.getItem('todoAdhdTheme')==='dark')"
          text = text.replace(marker, auto_js + '\n' + marker)
          text = text.replace("}render();\nif('serviceWorker'", "}render();autoLoadWeather();\nif('serviceWorker'")
          cal.write_text(text, encoding='utf-8')
          sw = Path('sw.js')
          if sw.exists():
              s = sw.read_text(encoding='utf-8')
              s = re.sub(r'const CACHE_NAME = "[^"]+";', 'const CACHE_NAME = "todoadhd-weather-autogps-v18";', s)
              sw.write_text(s, encoding='utf-8')
          PY
          git add calendar.html sw.js
          if git diff --cached --quiet; then
            echo "No weather changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "enable automatic gps weather"
          git push origin HEAD:main
          git push origin HEAD:gh-pages --force
