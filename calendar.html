<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TODOADHD 달력</title><style>:root{--ink:#293044;--sub:#697187;--line:#e8ebf3;--mist:#f7f8fc;--cloud:#eef4ff;--peach:#ffe6dc;--lilac:#eee6ff;--leaf:#e2f6e6;--rose:#ffe8ef;--denim:#5b7bd5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fff,var(--mist));color:var(--ink);font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}.app{width:min(100%,980px);margin:auto;min-height:100vh;padding:18px 16px 96px}h1{font-size:20px;line-height:1.25;margin:0}h2{font-size:17px;margin:0}.eyebrow{font-size:12px;font-weight:900;color:var(--denim);margin:0 0 5px}.muted{font-size:13px;line-height:1.6;color:var(--sub)}.card{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 12px 26px rgba(54,60,88,.08);padding:15px}.grid{display:grid;gap:14px;margin:18px auto 0;max-width:430px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:430px;margin:auto}.hero{display:flex;justify-content:space-between;gap:10px;align-items:center}.avatar{width:104px;height:104px;min-width:104px;position:relative;filter:drop-shadow(0 8px 0 #fff)}.hair{position:absolute;inset:0 8px 12px;border-radius:48%;background:#202435}.face{position:absolute;inset:10px 22px 16px;border-radius:45%;background:#fff1e8;border:3px solid #202435}.bang{position:absolute;left:19px;right:23px;top:19px;height:38px;border-radius:50% 50% 30% 30%;background:#202435}.eye{position:absolute;top:52px;width:8px;height:11px;border-radius:50%;background:#26324c}.eye.l{left:38px}.eye.r{right:38px}.mouth{position:absolute;left:47px;top:73px;width:18px;height:8px;border-bottom:3px solid #6a4d50;border-radius:0 0 20px 20px}.hood{position:absolute;left:23px;right:23px;bottom:4px;height:30px;border-radius:30px 30px 6px 6px;background:#293044}.prop{position:absolute;right:0;bottom:0;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#fff;border:1px solid var(--line)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.ghost,.primary{border-radius:8px;padding:11px 12px;font-weight:900}.ghost{background:var(--mist);color:var(--ink)}.primary{background:var(--ink);color:#fff;width:100%}.blue{background:var(--denim)}.week,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week span{text-align:center;font-size:11px;font-weight:900;color:var(--sub)}.day{min-height:72px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px;text-align:left}.day.off{opacity:.35}.day.sel{outline:2px solid var(--denim);background:var(--cloud)}.num{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:99px;font-size:12px;font-weight:900}.today .num{background:var(--ink);color:#fff}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--denim);margin:5px 2px 0 0}.task{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.check{width:26px;height:26px;border-radius:8px;border:2px solid #cfd5e4;display:grid;place-items:center;color:transparent}.done .check{background:var(--leaf);border-color:var(--leaf);color:var(--ink)}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--mist);padding:13px}textarea{min-height:128px;resize:none}.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}.screen{display:none}.screen.on{display:block}.tabs{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,430px);display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 10px 14px;background:#fff;border-top:1px solid var(--line)}.tabs button{height:56px;border-radius:8px;background:transparent;color:#737b90;font-size:11px;font-weight:900}.tabs button.on{background:var(--ink);color:#fff}.toast{position:fixed;left:16px;right:16px;bottom:92px;max-width:398px;margin:auto;border-radius:8px;background:var(--ink);color:#fff;padding:14px;display:none}@media(min-width:860px){.grid{max-width:none;grid-template-columns:1.1fr .9fr}.head{max-width:none}.day{min-height:96px}}</style></head><body><main class="app"><header class="head"><div><p class="eyebrow">ADHD 체크메이트 달력</p><h1>정신차려 이 각박한 세상에서,<br>그렇게 안 살기 프로젝트</h1></div></header><section id="home" class="screen on"><div class="grid"><article class="card"><div style="display:flex;justify-content:space-between;align-items:center"><button class="ghost" onclick="mv(-1)">이전</button><div style="text-align:center"><p class="eyebrow">첫 화면</p><h2 id="mt"></h2></div><button class="ghost" onclick="mv(1)">다음</button></div><div class="week" style="margin-top:14px"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="cal" id="cal" style="margin-top:8px"></div></article><aside class="card"><div class="hero"><div><p class="eyebrow">선택 날짜</p><h2 id="selTitle"></h2><p class="muted">날짜를 누르면 그날 해야 할 일이 보여요.</p></div><div class="avatar"><div class="hair"></div><div class="face"></div><div class="bang"></div><div class="eye l"></div><div class="eye r"></div><div class="mouth"></div><div class="hood"></div><div class="prop">🗓</div></div></div><div id="selTasks" style="display:grid;gap:9px;margin-top:14px"></div><button class="primary blue" style="margin-top:12px" onclick="go('add')">이 날짜에 할 일 추가</button></aside></div></section><section id="add" class="screen"><div class="grid"><article class="card"><p class="eyebrow">두 번째 화면</p><h2>해야 하는 일 추가하기</h2><p class="muted" id="addLabel" style="margin:8px 0 12px"></p><textarea id="rough" placeholder="대충 말해도 돼요. 예: 병원 예약 확인하고 영상 편집 조금, 카드값도 봐야 함."></textarea><div class="split" style="margin-top:10px"><input id="time" type="time" value="09:30"><select id="type"><option value="plan">계획</option><option value="edit">영상</option><option value="ai">AI 공부</option><option value="money">가계부/빚</option><option value="mind">감정</option></select></div><div class="split" style="margin-top:10px"><button class="primary blue" onclick="addTask()">찰떡같이 추가</button><button class="ghost" onclick="voice()">음성 추가</button></div></article><article class="card"><p class="eyebrow">AI 정리</p><div id="ai" style="display:grid;gap:9px"></div></article></div></section><section id="stickers" class="screen"><div class="grid"><article class="card"><p class="eyebrow">첨부 사진 스타일</p><h2>상황별 캐릭터 스티커</h2><div id="stick" style="display:flex;gap:10px;overflow:auto;margin-top:12px"></div></article></div></section><section id="mind" class="screen"><div class="grid"><article class="card"><p class="eyebrow">하소연</p><textarea id="vent" placeholder="오늘 아무것도 하기 싫다. 불안해서 쇼츠만 봄."></textarea><button class="primary blue" style="margin-top:10px" onclick="mind()">심리상태 분석</button></article><article class="card"><p class="eyebrow">조언</p><div id="mindOut"></div></article></div></section><section id="money" class="screen"><div class="grid"><article class="card"><p class="eyebrow">가계부</p><div class="split"><input id="spText" placeholder="지출 내용"><input id="spAmt" type="number" placeholder="금액"></div><button class="primary blue" style="margin-top:10px" onclick="spend()">기록</button></article><article class="card"><h2 id="total">0원</h2><div id="spList"></div></article></div></section></main><nav class="tabs"><button class="on" onclick="go('home',this)">달력</button><button onclick="go('add',this)">추가</button><button onclick="go('stickers',this)">스티커</button><button onclick="go('mind',this)">감정</button><button onclick="go('money',this)">가계부</button></nav><div class="toast" id="toast"></div><script>const now=new Date();let y=now.getFullYear(),m=now.getMonth(),sel=key(now);const data={[sel]:[{time:'09:30',text:'병원 시간 확인',type:'plan',done:false},{time:'13:00',text:'영상 파일 열기',type:'edit',done:false},{time:'21:30',text:'상환 날짜 체크',type:'money',done:false}]};const meta={plan:['오늘 계획','🗓','var(--cloud)'],edit:['영상 편집','🖥','var(--peach)'],ai:['AI 공부','📚','var(--lilac)'],money:['빚 정리','₩','var(--leaf)'],mind:['감정 정리','✎','var(--rose)']};const costs=[];function key(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function label(k){const a=k.split('-');return `${a[0]}년 ${+a[1]}월 ${+a[2]}일`}function render(){mt.textContent=`${y}년 ${m+1}월`;const first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());cal.innerHTML='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const k=key(d),list=data[k]||[];const b=document.createElement('button');b.className=`day ${d.getMonth()!=m?'off':''} ${k==sel?'sel':''} ${k==key(now)?'today':''}`;b.innerHTML=`<span class=num>${d.getDate()}</span><div>${list.slice(0,4).map(t=>`<i class=dot style="background:${meta[t.type]?.[2]}"></i>`).join('')}</div>${list.length?`<p class=muted>${list.length}개</p>`:''}`;b.onclick=()=>{sel=k;render()};cal.appendChild(b)}selTitle.textContent=label(sel);addLabel.textContent=`${label(sel)}에 추가됩니다.`;const list=data[sel]||[];selTasks.innerHTML=list.length?list.map((t,i)=>task(t,i)).join(''):'<p class=muted>아직 할 일이 없어요. 추가 탭에서 기록해요.</p>';stick.innerHTML=Object.values(meta).map(x=>`<article class=card style="width:145px;flex:0 0 auto;text-align:center"><span class=bubble>${x[0]}</span><div class=avatar style="transform:scale(.66);margin:auto;height:100px"><div class=hair></div><div class=face></div><div class=bang></div><div class="eye l"></div><div class="eye r"></div><div class=mouth></div><div class=hood></div><div class=prop>${x[1]}</div></div></article>`).join('')}function task(t,i){const x=meta[t.type]||meta.plan;return `<div class="task ${t.done?'done':''}" onclick="toggle(${i})"><div class=check>✓</div><div style=flex:1><p class=eyebrow>${t.time} · ${x[0]}</p><h3>${t.text}</h3></div><div>${x[1]}</div></div>`}function toggle(i){data[sel][i].done=!data[sel][i].done;if(data[sel][i].done)msg('완료! 쿼카 도장 찍었어요.');render()}function mv(n){m+=n;if(m<0){m=11;y--}if(m>11){m=0;y++}render()}function addTask(){const raw=rough.value.trim();if(!raw)return msg('할 일을 적어줘요.');const tp=/돈|빚|카드|상환|지출/.test(raw)?'money':/영상|편집|촬영/.test(raw)?'edit':/AI|공부|프롬프트/.test(raw)?'ai':/불안|감정|힘들|싫/.test(raw)?'mind':type.value;const arr=raw.split(/그리고|,|\.|랑|하고/).map(x=>x.trim()).filter(Boolean).slice(0,4);const list=data[sel] ||= [];arr.forEach((a,i)=>list.push({time:shift(time.value,i),text:a,type:tp,done:false}));ai.innerHTML='<div class=card><p class=eyebrow>AI 정리</p><p class=muted>선택 날짜에 작은 행동 단위로 쪼개서 넣었어요.</p></div>';rough.value='';render();go('home');msg('달력에 추가했어요.')}function shift(t,i){let [h,mm]=t.split(':').map(Number);return `${String(Math.min(23,h+i*2)).padStart(2,'0')}:${String(mm).padStart(2,'0')}`}function voice(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return msg('음성 입력 미지원 브라우저예요.');const r=new S();r.lang='ko-KR';r.onresult=e=>{rough.value=e.results[0][0].transcript;addTask()};r.start()}function mind(){const t=vent.value;mindOut.innerHTML=`<p class=muted>${/불안|힘들|스트레스|싫/.test(t)?'과부하 신호가 있어요. 오늘은 달력에서 제일 쉬운 할 일 하나만 체크하자.':'정리 가능한 상태예요. 오늘 흐름 하나만 살리자.'}</p>`}function spend(){let a=+spAmt.value;if(!a)return msg('금액 입력');costs.push({t:spText.value||'무제',a});total.textContent=costs.reduce((s,x)=>s+x.a,0).toLocaleString()+'원';spList.innerHTML=costs.map(x=>`<div class=task><div>₩</div><div><h3>${x.t}</h3><p class=muted>${x.a.toLocaleString()}원</p></div></div>`).join('')}function go(id,btn){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));(btn||document.querySelector(`.tabs button[onclick*="${id}"]`))?.classList.add('on')}function msg(t){toast.textContent=t;toast.style.display='block';setTimeout(()=>toast.style.display='none',2300)}render();</script></body></html>
