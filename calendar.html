function dateAdd(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x} const weekdays=['일','월','화','수','목','금','토'];
function nextDow(dow,base=new Date()){let diff=(dow-base.getDay()+7)%7; if(diff===0)diff=7; return dateAdd(base,diff)}
function thisDow(dow,base=new Date()){return dateAdd(base,(dow-base.getDay()+7)%7)}
function resolveDates(text){const t=text;let recurrence=null,dates=[];const dayMap={일:0,월:1,화:2,수:3,목:4,금:5,토:6};let m=t.match(/매주\s*([월화수목금토일])요일|([월화수목금토일])요일마다|주마다\s*([월화수목금토일])?/);if(/매일|맨날/.test(t))recurrence={type:'daily',label:'매일'};if(/평일마다/.test(t))recurrence={type:'weekday',label:'평일마다'};if(m){const ch=m[1]||m[2]||m[3]||'토';recurrence={type:'weekly',day:dayMap[ch],label:`매주 ${ch}요일`};}if(/오늘/.test(t))dates.push(new Date()); if(/내일/.test(t))dates.push(dateAdd(new Date(),1)); if(/모레/.test(t))dates.push(dateAdd(new Date(),2));m=t.match(/다음주\s*([월화수목금토일])요일?/); if(m)dates.push(dateAdd(thisDow(dayMap[m[1]]),7));m=t.match(/이번주\s*([월화수목금토일])요일?/); if(m)dates.push(thisDow(dayMap[m[1]]));m=t.match(/(\d{1,2})월\s*(\d{1,2})일/); if(m)dates.push(new Date(new Date().getFullYear(),+m[1]-1,+m[2]));if(/이번주까지|이번 주까지/.test(t)&&!dates.length)dates.push(thisDow(5));if(recurrence&&!dates.length)dates.push(recurrence.type==='weekly'?nextDow(recurrence.day):new Date());if(!dates.length)dates.push(new Date(selected));return {dates,recurrence}}
function splitIntents(raw){return raw.replace(/\n+/g,' 그리고 ').split(/(?:,|;|그리고|또|있고|있으며|해야 하고|해야돼|해야 해|하면 되고)/).map(s=>s.trim()).filter(Boolean)}
function titleFrom(text){let t=text.replace(/다음주|이번주|오늘|내일|모레|매주|매일|맨날|평일마다|주마다|[월화수목금토일]요일마다?|이번주까지|이번 주까지|\d{1,2}월\s*\d{1,2}일/g,' ').replace(/있고|있어|있다|해야돼|해야 해|해야함|해야|까지|마다|좀|그리고/g,' ').replace(/\s+/g,' ').trim();if(/기획서|보고서/.test(text)&&/내|제출/.test(text)) t=t.replace(/내.*/,'').trim()+' 제출';if(!t)t='할 일';return t.slice(0,30)}
function priorityOf(text,date){const d=Math.ceil((new Date(date)-new Date(new Date().toDateString()))/86400000);if(d<=1||/마감|제출|보고서|기획서|병원|미팅|회의|상환|결제|예약/.test(text))return {level:1,label:'🔥 지금 꼭 해야 함',why:'마감이나 약속성이 있어서 먼저 잡아둘게.'};if(/5분|짧|전화|연락|확인|정리/.test(text))return {level:2,label:'⚡ 15분만 하면 끝남',why:'짧게 끝낼 수 있는 행동이야.'};return {level:3,label:'🌱 가볍게 시작 가능',why:'부담 낮게 시작하면 흐름이 살아나.'}}
function timeFor(i,p){if(p.level===1)return ['09:30','13:00','16:30','19:30'][i%4]; if(p.level===2)return ['11:00','15:30','20:30'][i%3]; return ['14:00','18:00','21:30'][i%3]}
function parseSchedule(){const raw=$('#bulkInput')?.value.trim(); if(!raw)return;const chunks=splitIntents(raw);let made=[];chunks.forEach((piece,idx)=>{const r=resolveDates(piece),title=titleFrom(piece),type=stickerType(piece+' '+title);let dates=r.dates;if(r.recurrence){dates=[];let start=r.dates[0];for(let i=0;i<4;i++)dates.push(r.recurrence.type==='daily'?dateAdd(start,i):r.recurrence.type==='weekday'?dateAdd(start,i):dateAdd(start,i*7));}dates.forEach((d,j)=>{const p=priorityOf(piece,key(d));made.push({id:Date.now()+Math.random(),date:key(d),time:timeFor(idx+j,p),text:title,type,done:false,priority:p.level,priorityLabel:p.label,reason:p.why,recurrence:r.recurrence,createdAt:Date.now(),delayCount:0});});});tasks=[...tasks,...made];saveAll();$('#bulkInput').value='';selected=new Date(made[0]?.date||selected);cursor=new Date(selected.getFullYear(),selected.getMonth(),1);view='calendar';render();toast(`${chunks.length}개 행동을 ${made.length}개 일정 카드로 쪼갰어.`)}
function renderMenus(){const html=menus.map(([id,label])=>`<button class="${view===id?'active':''}" data-view="${id}">${icon[id]} ${label}</button>`).join('');$('#sideMenu').innerHTML=html;$('#mobileNav').innerHTML=menus.slice(0,5).map(([id,label])=>`<button class="${view===id?'active':''}" data-view="${id}">${icon[id]}<br>${label}</button>`).join('');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});}
function tasksOn(k){return tasks.filter(t=>t.date===k).sort((a,b)=>(a.done-b.done)||(a.priority-b.priority)||a.time.localeCompare(b.time))}
function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),start=new Date(y,m,1),first=start.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells=[];for(let i=0;i<42;i++){const n=i-first+1;let d=n<1?new Date(y,m-1,prev+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n);const k=key(d),list=tasksOn(k),visible=list.slice(0,2),done=list.some(t=>t.done),hot=list.some(t=>t.priority===1&&!t.done);cells.push(`<button class="day ${d.getMonth()!==m?'other':''} ${k===key(selected)?'selected':''}" data-date="${k}"><span class="day-num">${d.getDate()}</span>${list.length?`<span class="dots"><i class="dot ${hot?'hot':''}"></i><i class="dot"></i></span>`:''}<div class="day-list">${visible.map(t=>`<div class="day-task ${t.priority===1&&!t.done?'hot':''} ${t.done?'done':''}">${sticker(t.type,'day-sticker')}<div class="day-task-text"><strong>${safe(t.text)}</strong><span>${safe(t.time)}</span></div></div>`).join('')}${list.length>2?`<div class="more">+${list.length-2}개 더보기</div>`:''}</div>${done?sticker('stamp','mini-stamp'):''}</button>`)}
$('#main').innerHTML=`<section class="section-title"><div><h2>달력</h2><p>한 칸에는 행동 2개까지만. 나머지는 더보기로 숨겨서 머리를 덜 시끄럽게 만들었어.</p></div><button class="primary" id="goAdd">일정 추가</button></section><section class="briefing"><div><h3>오늘의 흐름</h3><p id="briefText">${briefText()}</p><div class="brief-list">${briefPills()}</div></div><div class="weather-box" id="weatherBox">${weatherHtml()}<button class="ghost" id="weatherBtn" style="margin-top:10px;width:100%">날씨 갱신</button></div></section><div class="cal-head"><button class="ghost" id="prevM">이전</button><h2>${y}년 ${m+1}월</h2><button class="ghost" id="nextM">다음</button></div><div class="week">${weekdays.map(w=>`<div>${w}</div>`).join('')}</div><div class="calendar">${cells.join('')}</div>`;$('#goAdd').onclick=()=>{view='add';render()};$('#prevM').onclick=()=>{cursor=new Date(y,m-1,1);render()};$('#nextM').onclick=()=>{cursor=new Date(y,m+1,1);render()};$('#weatherBtn').onclick=loadWeather;document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date);render()});}
function briefText(){const list=tasksOn(todayKey()).filter(t=>!t.done),hot=list.find(t=>t.priority===1),late=tasks.filter(t=>!t.done&&t.date<todayKey()).length,investToday=invests.some(i=>i.date===todayKey());let arr=[];if(hot)arr.push(`${hot.text} 먼저 잡으면 오늘 흐름이 편해져.`);if(late)arr.push(`밀린 카드 ${late}개는 한 번에 보지 말고 하나만 집자.`);if(!investToday)arr.push('투자 복기는 수익보다 감정 흔들림 체크가 먼저야.');if(weather?.advice)arr.push(weather.advice);return arr.slice(0,3).join(' ' )||'오늘은 작은 행동 하나만 제대로 시작해도 충분히 이어질 수 있어.'}

function weatherHtml(){if(!weather)return '<strong>오늘 날씨</strong><span class="muted">위치 허용하면 온도, 습도, 비, 미세먼지를 불러올게.</span>';return `<strong>${weather.temp}°C · 습도 ${weather.humidity}%</strong><div class="muted">비 ${weather.rain}mm · 미세먼지 PM2.5 ${weather.pm25??'대기'} · ${safe(weather.advice)}</div>`}
async function loadWeather(){if(!navigator.geolocation){toast('브라우저가 위치를 지원하지 않아.');return}navigator.geolocation.getCurrentPosition(async p=>{try{const {latitude,longitude}=p.coords;const f=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,relative_humidity_2m,rain,precipitation&timezone=auto`);const a=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${latitude}&longitude=${longitude}&current=pm2_5,pm10&timezone=auto`);const fj=await f.json(),aj=await a.json(),c=fj.current||{},aq=aj.current||{};let advice=c.rain>0?'비 와서 이동시간을 10분 더 잡는 게 좋아.':c.temperature_2m>=27?'더워서 오후 집중력이 떨어질 수 있어. 중요한 건 오전 쪽으로.':'날씨는 무난해. 카페 작업이나 짧은 산책을 끼워도 좋아.';weather={temp:Math.round(c.temperature_2m),humidity:c.relative_humidity_2m,rain:c.rain||c.precipitation||0,pm25:aq.pm2_5?Math.round(aq.pm2_5):null,advice,at:Date.now()};store('todoAdhdWeather',weather);render();}catch(e){toast('날씨를 못 불러왔어. 잠시 후 다시 해보자.')}},{enableHighAccuracy:false,timeout:9000})}

function renderRoute(){const last=routes[0];$('#main').innerHTML=`<section class="section-title"><div><h2>이동 계산</h2><p>약속 장소까지 가는 시간을 일정 앞에 붙여서 까먹는 걸 줄여.</p></div></section><div class="quick-form"><input id="place" placeholder="약속 장소 / 주소"/><select id="mode"><option>대중교통</option><option>자동차</option><option>도보</option></select><button class="primary" id="saveRoute">장소 저장</button></div>${last?`<div class="divider"></div><div class="soft-card"><h3>최근 장소</h3><p class="muted">${safe(last.place)} · ${safe(last.mode)} · 실제 경로 API 연결 전까지는 출발 40분 전 알림 권장</p></div>`:''}`;$('#saveRoute').onclick=()=>{routes.unshift({date:todayKey(),place:$('#place').value,mode:$('#mode').value});saveAll();render()}}
function renderClients(){ $('#main').innerHTML=`<section class="section-title"><div><h2>클라이언트</h2><p>협력하는 사람과 할 말을 따로 보관해.</p></div></section><div class="quick-form"><input id="clientName" placeholder="클라이언트 이름"/><textarea id="clientMemo" placeholder="현재 진행 / 다음 연락 / 주의할 점"></textarea><button class="primary" id="addClient">저장</button></div><div class="divider"></div><div class="cards">${clients.map(c=>`<div class="task-card">${sticker('client','task-sticker')}<div><p class="task-title">${safe(c.name)}</p><p class="muted">${safe(c.memo)}</p></div></div>`).join('')}</div>`;$('#addClient').onclick=()=>{clients.unshift({name:$('#clientName').value,memo:$('#clientMemo').value});saveAll();render()}}
function renderWish(){ $('#main').innerHTML=`<section class="section-title"><div><h2>위시 / 워너비</h2><p>사고 싶은 것, 하고 싶은 것, 되고 싶은 모습을 객관적으로 정리해.</p></div></section><div class="quick-form"><input id="wishText" placeholder="예: 카메라 사고 싶음"/><select id="wishKind"><option>사고싶은 것</option><option>하고싶은 것</option><option>워너비</option></select><button class="primary" id="addWish">저장</button></div><div class="divider"></div><div class="cards">${wishes.map(w=>`<div class="task-card">${sticker(/사고|쇼핑/.test(w.kind)?'shopping':'praise','task-sticker')}<div><p class="task-title">${safe(w.text)}</p><p class="muted">${safe(w.kind)} · 오늘 당장 살지 말고 24시간 보류하면 충동성이 줄어.</p></div></div>`).join('')}</div>`;$('#addWish').onclick=()=>{wishes.unshift({text:$('#wishText').value,kind:$('#wishKind').value});saveAll();render()}}
function renderPanel(){const k=key(selected),list=tasksOn(k),done=list.filter(t=>t.done).length,hot=list.find(t=>t.priority===1&&!t.done);$('#panel').innerHTML=`<h3>선택 날짜 상세</h3><p class="muted"><b>${k}</b><br>다시 이어서 하면 돼.</p><div class="divider"></div><h3>오늘 할 일</h3><div class="cards">${list.length?list.map(t=>`<div class="task-card ${t.done?'done':''}">${sticker(t.type,'task-sticker')}<div><p class="task-title">${safe(t.time)} · ${safe(t.text)}</p><div class="task-meta"><span class="meta">${safe(t.priorityLabel||priorityOf(t.text,t.date).label)}</span>${t.recurrence?`<span class="meta">${safe(t.recurrence.label)}</span>`:''}</div><p class="muted">${safe(t.reason||'한 행동만 보면 충분해.')}</p></div><button class="check ${t.done?'on':''}" data-check="${t.id}">${t.done?'✓':''}</button></div>`).join(''):'<p class="muted">이 날은 아직 비어 있어. 일부러 비워도 괜찮아.</p>'}</div><button class="primary" id="panelAdd" style="width:100%;margin-top:12px">이 날짜에 추가</button><div class="divider"></div><h3>AI 우선순위</h3><p class="muted">${hot?`${hot.text}: ${hot.priorityLabel}`:'급한 불은 없어. 가벼운 것부터 잡아도 돼.'}</p><div class="stat-row"><div class="stat"><b>${done}/${list.length}</b><span>완료</span></div><div class="stat"><b>${streak.count||0}일</b><span>streak</span></div></div><div class="divider"></div><h3>날씨 / 이동 / 투자</h3><p class="muted">${weather?weather.advice:'날씨를 불러오면 이동과 집중 조언을 붙여줄게.'}<br>${routes[0]?`최근 장소: ${safe(routes[0].place)}`:'이동 탭에서 약속 장소를 저장해봐.'}<br>${invests.some(i=>i.date===k)?'투자 복기 완료':'투자 복기 알림 대기'}</p><div class="divider"></div><h3>오늘 받은 스티커</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${list.filter(t=>t.done).slice(0,5).map(t=>sticker(t.type,'task-sticker')).join('')||sticker('stamp','task-sticker')}</div>`;$('#panelAdd').onclick=()=>{view='add';render()};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.check));}
function toggleTask(id){const t=tasks.find(x=>String(x.id)===String(id));if(!t)return;t.done=!t.done;if(t.done){const doneToday=tasksOn(t.date).filter(x=>x.done).length;if(t.date===todayKey()&&streak.last!==todayKey()){streak.count=(streak.count||0)+1;streak.last=todayKey()}toast(doneToday>=3?'오늘 3개 완료. 많이 한 날이야.':t.recurrence?'반복 루틴 이어짐. 잘 붙잡았어.':'완료 도장 찍었어.',true)}saveAll();render()}
function toast(msg,stamp=false){document.querySelectorAll('.reward-toast,.confetti').forEach(x=>x.remove());if(stamp){const c=document.createElement('div');c.className='confetti';document.body.appendChild(c);setTimeout(()=>c.remove(),900)}const el=document.createElement('div');el.className='reward-toast';el.innerHTML=`${stamp?sticker('stamp','task-sticker stamp-pop'):''}<strong>${safe(msg)}</strong>`;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
/* viewport-js-v17 */

function renderCalendar(){const y=cursor.getFullYear(),m=cursor.getMonth(),start=new Date(y,m,1),first=start.getDay(),days=new Date(y,m+1,0).getDate(),prev=new Date(y,m,0).getDate();let cells=[];for(let i=0;i<42;i++){const n=i-first+1;let d=n<1?new Date(y,m-1,prev+n):n>days?new Date(y,m+1,n-days):new Date(y,m,n);const k=key(d),list=tasksOn(k),done=list.some(t=>t.done),hot=list.some(t=>t.priority===1&&!t.done),dots=list.slice(0,4).map((t,idx)=>`<i class="dot ${idx===0&&hot?'hot':''}"></i>`).join('');cells.push(`<button class="day ${d.getMonth()!==m?'other':''} ${k===key(selected)?'selected':''}" data-date="${k}"><span class="day-num">${d.getDate()}</span>${list.length?`<span class="dots">${dots}</span><span class="day-count ${hot?'hot':''}">${list.length}개</span>`:''}${done?sticker('stamp','mini-stamp'):''}</button>`)}
$('#main').innerHTML=`<section class="section-title"><div><h2>달력</h2><p>일정 미리보기는 오른쪽 패널에서 보고, 달력은 한눈에 보기 좋게 고정했어.</p></div><button class="primary" id="goAdd">일정 추가</button></section><div class="cal-wrapper"><div class="cal-head"><button class="ghost" id="prevM">이전</button><h2>${y}년 ${m+1}월</h2><button class="ghost" id="nextM">다음</button></div><div class="week">${weekdays.map(w=>`<div>${w}</div>`).join('')}</div><div class="calendar">${cells.join('')}</div></div>`;$('#goAdd').onclick=()=>{view='add';render()};$('#prevM').onclick=()=>{cursor=new Date(y,m-1,1);render()};$('#nextM').onclick=()=>{cursor=new Date(y,m+1,1);render()};document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.date);render()});}
function renderPanel(){const k=key(selected),list=tasksOn(k),done=list.filter(t=>t.done).length,hot=list.find(t=>t.priority===1&&!t.done);$('#panel').innerHTML=`<section class="briefing" style="margin-bottom:18px"><div><h3>오늘의 흐름</h3><p id="briefText">${briefText()}</p><div class="brief-list">${briefPills()}</div></div><div class="weather-box" id="weatherBox">${weatherHtml()}<button class="ghost" id="weatherBtn" style="margin-top:10px;width:100%">날씨 갱신</button></div></section><h3>선택 날짜 상세</h3><p class="muted"><b>${k}</b><br>날짜를 누르면 전체 일정은 여기서 확인해.</p><div class="divider"></div><h3>오늘 할 일</h3><div class="cards">${list.length?list.map(t=>`<div class="task-card ${t.done?'done':''}">${sticker(t.type,'task-sticker')}<div><p class="task-title">${safe(t.time)} · ${safe(t.text)}</p><div class="task-meta"><span class="meta">${safe(t.priorityLabel||priorityOf(t.text,t.date).label)}</span>${t.recurrence?`<span class="meta">${safe(t.recurrence.label)}</span>`:''}</div><p class="muted">${safe(t.reason||'한 행동만 보면 충분해.')}</p></div><button class="check ${t.done?'on':''}" data-check="${t.id}">${t.done?'✓':''}</button></div>`).join(''):'<p class="muted">이 날은 아직 비어 있어. 일부러 비워도 괜찮아.</p>'}</div><button class="primary" id="panelAdd" style="width:100%;margin-top:12px">이 날짜에 추가</button><div class="divider"></div><h3>AI 우선순위</h3><p class="muted">${hot?`${hot.text}: ${hot.priorityLabel}`:'급한 불은 없어. 가벼운 것부터 잡아도 돼.'}</p><div class="stat-row"><div class="stat"><b>${done}/${list.length}</b><span>완료</span></div><div class="stat"><b>${streak.count||0}일</b><span>streak</span></div></div><div class="divider"></div><h3>날씨 / 이동 / 투자</h3><p class="muted">${weather?weather.advice:'날씨를 불러오면 이동과 집중 조언을 붙여줄게.'}<br>${routes[0]?`최근 장소: ${safe(routes[0].place)}`:'이동 탭에서 약속 장소를 저장해봐.'}<br>${invests.some(i=>i.date===k)?'투자 복기 완료':'투자 복기 알림 대기'}</p><div class="divider"></div><h3>오늘 받은 스티커</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${list.filter(t=>t.done).slice(0,5).map(t=>sticker(t.type,'task-sticker')).join('')||sticker('stamp','task-sticker')}</div>`;$('#weatherBtn').onclick=loadWeather;$('#panelAdd').onclick=()=>{view='add';render()};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.check));}

function render(){renderMenus(); if(view==='calendar')renderCalendar(); if(view==='add')renderAdd(); if(view==='focus')renderFocus(); if(view==='stickers')renderStickerPage(); if(view==='mood')renderMood(); if(view==='money')renderMoney(); if(view==='invest')renderInvest(); if(view==='route')renderRoute(); if(view==='clients')renderClients(); if(view==='wish')renderWish(); renderPanel();}
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('todoAdhdTheme',document.body.classList.contains('dark')?'dark':'light')}; if(localStorage.getItem('todoAdhdTheme')==='dark')document.body.classList.add('dark'); if(!tasks.length){tasks=[{id:1,date:todayKey(),time:'09:30',text:'오늘 계획 세우기',type:'planning',done:false,priority:2,priorityLabel:'⚡ 15분만 하면 끝남',reason:'하루 흐름을 가볍게 잡는 카드야.'},{id:2,date:todayKey(),time:'13:00',text:'AI 공부 / 프롬프트 공부',type:'ai',done:false,priority:3,priorityLabel:'🌱 가볍게 시작 가능',reason:'5분만 시작해도 충분해.'},{id:3,date:todayKey(),time:'21:30',text:'일기 / 감사일기 쓰기',type:'journal',done:false,priority:3,priorityLabel:'🌱 가볍게 시작 가능',reason:'오늘 마음 상태를 남기는 카드야.'}];saveAll()}render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
